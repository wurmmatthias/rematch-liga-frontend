<div class="planner-controls">
  <button (click)="setTeam('red')">🔴 Team A</button>
  <button (click)="setTeam('blue')">🔵 Team B</button>
  <button (click)="setTool('arrow')">➡️ Pfeile</button>
  <button (click)="undo()">↩️</button>
  <button (click)="reset()">♻️</button>
  <button (click)="exportImage()">📸 Exportieren</button>
</div>

<div class="planner-container">
  <canvas #canvas (click)="onClick($event)"></canvas>
</div>
